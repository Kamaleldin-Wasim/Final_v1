<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LungCare — Check Your Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/style/auth.css" />
</head>
<body>

  <div class="bg"></div>
  <div class="blob blob-tl"></div>
  <div class="blob blob-tr"></div>
  <div class="blob blob-bl"></div>

  <div class="card-wrap">
    <div class="brand">LungCare</div>

    <div class="card">
      <h1>Check your code</h1>
      <p class="subtitle" id="subtitle">
        We sent a 4-digit code to <strong id="emailDisplay">your email</strong>.<br/>
        Enter it below to continue.
      </p>

      <!-- Alert banner (error / success) -->
      <div class="alert alert-error" id="alertBox" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="alertText">Invalid code. Please try again.</span>
      </div>

      <!-- Code label -->
      <div class="field" style="margin-bottom: 4px;">
        <label>Code</label>
      </div>

      <!-- 4-digit OTP inputs -->
      <div class="otp-group" id="otpGroup">
        <input class="otp-input" type="number" maxlength="1" min="0" max="9"
               id="otp0" inputmode="numeric" autocomplete="one-time-code" placeholder="·" />
        <input class="otp-input" type="number" maxlength="1" min="0" max="9"
               id="otp1" inputmode="numeric" placeholder="·" />
        <input class="otp-input" type="number" maxlength="1" min="0" max="9"
               id="otp2" inputmode="numeric" placeholder="·" />
        <input class="otp-input" type="number" maxlength="1" min="0" max="9"
               id="otp3" inputmode="numeric" placeholder="·" />
      </div>

      <!-- Confirm button -->
      <button class="btn btn-primary" type="button" id="confirmBtn">
        <span class="spinner"></span>
        <span class="btn-text">Confirm Code</span>
      </button>

      <!-- Resend -->
      <div class="resend-row">
        Didn't receive a code?
        <span class="link" id="resendLink">Resend Code</span>
      </div>

      <p class="footer-text">
        <a href="forgot-password.html">← Change email</a>
      </p>
    </div>
  </div>
<script src="../../assets/Js/config.js"></script>
  <script src="../../assets/Js/auth.js"></script>
</body>
</html>
