<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LungCare — Password Recovery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/style/auth.css" />
</head>
<body>

  <div class="bg"></div>
  <div class="blob blob-tl"></div>
  <div class="blob blob-tr"></div>
  <div class="blob blob-bl"></div>

  <div class="card-wrap">
    <div class="brand">LungCare</div>

    <div class="card">
      <h1>Password recovery</h1>
      <p class="subtitle">
        Enter the email address linked to your account and we'll send you a recovery code.
      </p>

      <!-- Alert banner -->
      <div class="alert alert-error" id="alertBox" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="alertText">Something went wrong. Please try again.</span>
      </div>

      <!-- Email field -->
      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <input
            type="email"
            id="email"
            placeholder="user@gmail.com"
            autocomplete="email"
          />
        </div>
      </div>

      <!-- Submit button -->
      <button class="btn btn-primary" type="button" id="sendBtn">
        <span class="spinner"></span>
        <span class="btn-text">Recover Password</span>
      </button>

      <p class="footer-text">
        Remembered it? <a href="login.html">Back to Login</a>
      </p>
    </div>
  </div>
   <script src="../../assets/Js/config.js"></script>
  <script src="../../assets/Js/auth.js"></script>
</body>
</html>
