<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LungCare — Create an Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/style/auth.css" />
</head>
<body>

  <div class="bg"></div>
  <div class="blob blob-tl"></div>
  <div class="blob blob-tr"></div>
  <div class="blob blob-bl"></div>

  <div class="card-wrap">
    <div class="brand">LungCare</div>

    <div class="card">
      <h1>Create an account</h1>

      <!-- Alert banner (error / success) -->
      <div class="alert alert-error" id="alertBox" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="alertText">Something went wrong. Please try again.</span>
      </div>

      <!-- Username -->
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <input
            type="text"
            id="username"
            placeholder="Choose a username"
            autocomplete="username"
          />
        </div>
      </div>

      <!-- Email -->
      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <input
            type="email"
            id="email"
            placeholder="user@gmail.com"
            autocomplete="email"
          />
        </div>
      </div>

      <!-- Password -->
      <div class="field">
        <label for="regPassword">Password</label>
        <div class="input-wrap">
          <input
            type="password"
            id="regPassword"
            placeholder="Enter your password"
            autocomplete="new-password"
          />
          <button class="toggle-pw" type="button" id="toggleRegPw" aria-label="Toggle password visibility">
            <svg id="eyeIconReg" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrap">
          <input
            type="password"
            id="confirmPassword"
            placeholder="Re-enter your password"
            autocomplete="new-password"
          />
          <button class="toggle-pw" type="button" id="toggleConfirmPw" aria-label="Toggle confirm password visibility">
            <svg id="eyeIconConfirm" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <!-- Live match indicator -->
        <span class="match-hint" id="matchHint"></span>
      </div>

      <!-- Create Account button -->
      <button class="btn btn-primary" type="button" id="registerBtn">
        <span class="spinner"></span>
        <span class="btn-text">Create account</span>
      </button>

      <!-- Google -->
      <button class="btn btn-google" type="button">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <p class="footer-text">
        Already Have An Account? <a href="login.html">Log In</a>
      </p>
    </div>
  </div>
  <script src="../../assets/Js/config.js"></script>
  <script src="../../assets/Js/auth.js"></script>
</body>
</html>
